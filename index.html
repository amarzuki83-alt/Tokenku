<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>tokenku - Cetak Struk PLN & Bukti Transfer</title>
    <meta name="description" content="Aplikasi PWA cetak struk token listrik PLN dan bukti transfer dengan OCR offline, Web Bluetooth printer thermal, dan export gambar struk." />
    <meta property="og:title" content="tokenku - Cetak Struk PLN & Bukti Transfer" />
    <meta property="og:description" content="Aplikasi PWA cetak struk token listrik PLN dan bukti transfer dengan OCR offline, Web Bluetooth printer thermal, dan export gambar struk." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="tokenku" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-sky-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA & Android Share Target
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => {
              console.log('tokenku ServiceWorker registered successfully:', reg.scope);
            })
            .catch(err => {
              console.warn('tokenku ServiceWorker registration error:', err);
            });
        });
      }
    </script>
  </body>
